name: Support another assistant
description: Request an adapter for an AI tool mycelium doesn't read yet
labels: [adapter]
body:
  - type: markdown
    attributes:
      value: |
        Adapters are the part most likely to break when upstream tools change,
        and we can only support formats we have samples for. A good sample is
        worth more than a good argument here.

  - type: input
    id: tool
    attributes:
      label: Which tool
      placeholder: Cursor, Aider, Windsurf, Cline, opencode…
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Where does it store history
      placeholder: ~/.config/foo/sessions, or a SQLite file at …
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - JSONL (one JSON object per line)
        - JSON
        - SQLite
        - Markdown
        - Other / unknown
    validations:
      required: true

  - type: textarea
    id: signals
    attributes:
      label: Does it record tool failures explicitly?
      description: >-
        This is the decisive question. Stage-1 detection needs a structural
        signal — an error flag, an exit code, a failed-command marker. If the
        format only stores prose, the adapter is much harder to make useful.
        Quote the relevant field if you can.
    validations:
      required: true

  - type: checkboxes
    id: sample
    attributes:
      label: Sample
      options:
        - label: >-
            I can provide an anonymized sample transcript, scrubbed of all
            credentials and proprietary code.
