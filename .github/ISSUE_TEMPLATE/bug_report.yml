name: Bug report
description: Something behaved differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real credential into this form.** mycelium handles secrets
        by nature — if your report involves one, describe its *shape*
        (`sk-` + 48 chars) and report it privately instead. See SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. mycelium import
        2. ...
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Which part
      options:
        - Adapter (reading a transcript format)
        - Stage-1 scan (which windows get detected)
        - Distillation (note quality)
        - Deduplication / merging
        - Vault writing
        - MCP server / search
        - Redaction
        - Not sure
    validations:
      required: true

  - type: input
    id: assistant
    attributes:
      label: Assistant and version
      placeholder: Claude Code 2.0.x / Codex CLI 0.x
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.2 / Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Output of `mycelium status`, or the error. Scrub it first.
      render: shell
