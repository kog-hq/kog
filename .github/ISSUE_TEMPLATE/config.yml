blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/bstcoc/mycelium/security/advisories/new
    about: >-
      Never report a security problem in a public issue. Use private
      vulnerability reporting instead — especially anything where a secret
      could reach a place the user did not consent to.
  - name: Question or idea
    url: https://github.com/bstcoc/mycelium/discussions
    about: >-
      For open-ended questions and design discussion. Pushback on the design
      document is welcome and useful.
