name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # kog-cli embeds app/dist into the binary at compile time
      # (crates/kog-cli/build.rs); the page must exist before any
      # cargo command that touches that crate, including fmt/clippy/test.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build the page
        run: |
          cd app
          bun install
          bun run build

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

  release-workflow:
    name: release.yml matches its config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # release.yml is generated from dist-workspace.toml and
      # .github/build-setup.yml — editing either without regenerating leaves
      # a release path that builds something other than what the config says,
      # and nothing finds out until a tag is pushed and the binaries are
      # already wrong. `just release-ci` regenerates it.
      #
      # Pinned to the same version as `cargo-dist-version` in
      # dist-workspace.toml: a different one generates a different file and
      # this check would fail for a reason that is not a mistake.
      - name: Install dist
        env:
          DIST_VERSION: "0.32.0"
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: Check for drift
        run: dist generate --check

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # KOG itself does not process credentials or personal data (see
      # .gitleaks.toml) — but an accidentally committed secret (an API key
      # pasted into a fixture, a token left in a commit message) is still a
      # real incident for this repository like any other, so the whole
      # history is scanned rather than a diff.
      #
      # gitleaks is invoked directly instead of through gitleaks-action: the
      # action derives its scan range from the push event, which breaks after
      # any history rewrite (it resolves <root>^ and aborts). Scanning the full
      # clone is deterministic and behaves the same on pushes, PRs and forks.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --redact --verbose .
