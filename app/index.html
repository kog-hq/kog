<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>KOG</title>
    <!--
      The theme is set before first paint, so a light-mode reader never gets a
      black flash and a dark-mode one never gets a white one. The stored choice
      wins over the operating system's, which is what a toggle means; the app
      reads the same key.
    -->
    <script>
      (() => {
        const stored = localStorage.getItem("kog:theme");
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.background = theme === "light" ? "#fbfbfd" : "#0d0d0f";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
