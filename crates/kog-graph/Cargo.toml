[package]
name = "kog-graph"
description = "Turns a codebase into a file/import graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not published, but not with `publish = false` — that field makes the
# package invisible to release-plz rather than unpublishable, and takes the
# whole release path down with it. See the note in kog-cli/Cargo.toml; the
# refusal is in release-plz.toml.

[dependencies]
anyhow.workspace = true
ignore.workspace = true
jsonc-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
streaming-iterator.workspace = true
thiserror.workspace = true
toml.workspace = true
yaml_serde.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-css.workspace = true
tree-sitter-go.workspace = true
tree-sitter-html.workspace = true
tree-sitter-java.workspace = true
tree-sitter-php.workspace = true
tree-sitter-python.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true

[dev-dependencies]
tempfile = "3"
