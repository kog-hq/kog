# release-plz decides *when* there is a release and what its version is;
# `dist` decides what a release contains. They meet at one git tag.
#
# The sequence, from the second release on: a push to main updates a "chore:
# release" PR that bumps the version and writes the changelog from the
# conventional commits since the last tag. Merging that PR pushes the tag,
# and the tag starts `.github/workflows/release.yml`, which builds the five
# binaries and creates the GitHub Release with them attached.
#
# The first one is different, and it is worth knowing before it happens.
# `0.1.0` has never been tagged, so release-plz has nothing to bump: it
# considers the current version unreleased and tags `v0.1.0` on the next push
# to main, with no release PR in between. There is also no CHANGELOG.md yet,
# so that first GitHub Release carries an empty body. Both are one-time.

[workspace]
# `dist` creates the GitHub Release, with `gh release create` in its `host`
# job. If release-plz created one first for the same tag that command fails,
# and it fails *after* the binaries have been built — an hour of runners for
# nothing. So exactly one of the two tools makes releases, and it is the one
# holding the artifacts.
git_release_enable = false

# Neither crate goes to crates.io, and **this** is the line that says so —
# not `publish = false` in the manifests, which was the first attempt and
# which silently disabled everything below it.
#
# release-plz filters every package through `is_publishable()`, which reads
# the manifest's `publish` field, and it does that in the update path as well
# as the release path. A manifest saying `publish = false` therefore does not
# produce "release it but skip cargo publish"; it produces "there are no
# packages" — no version bump, no changelog, no tag, and `INFO nothing to
# release` as the only trace. Since the tag is what builds the binaries, the
# whole release path goes quiet and reports success.
#
# Here the same words mean what they should: release normally, never run
# cargo publish. No CARGO_REGISTRY_TOKEN is needed anywhere, and versions are
# compared against git tags rather than against the registry.
publish = false

[[package]]
name = "kog-graph"
# One tag per release, not one per crate. The two crates share a version
# (`version.workspace = true`) so they move together anyway, and `dist`
# starts a separate Release run for every tag pushed — a second tag would
# start a run for a library that produces no binary, which fails.
git_tag_enable = false
# And no changelog either, for the same reason one step further on. Every
# heading in a generated changelog links to the tag of its version, so a
# crate with no tag gets a file of dead links — the first one already pointed
# at `kog-graph-v0.1.0`, which by design does not exist. One changelog, for
# the thing that ships; it is also the one `dist` reads to write the release
# notes.
changelog_update = false

[[package]]
name = "kog-cli"
# `v0.2.0`, not the workspace default `kog-cli-v0.2.0`: the tag names the
# release, and the release is the `kog` binary. It also has to match what
# release.yml watches for, `'**[0-9]+.[0-9]+.[0-9]+*'`.
git_tag_name = "v{{ version }}"
